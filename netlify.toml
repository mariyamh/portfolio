# Netlify build settings, kept in the repo so the dashboard cannot drift.
# Netlify detects Next.js and runs it with its Next.js runtime: pages are
# served from .next, and app/api/contact becomes a serverless function.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# The Next.js runtime: turns the build into Netlify's routes, edge handling and
# a serverless function for app/api/contact. Listed explicitly (and pinned in
# devDependencies) so the deploy never falls back to uploading .next as files.
[[plugins]]
  package = "@netlify/plugin-nextjs"
